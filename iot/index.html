<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT Blast Radius 3D</title>
<!-- 3D view of the same engine output as the 2D demo. Reads window.RESULTS (shape: src/report.py).
     Default data: ../demo/results.js   (python -m src.main scenarios/home.yaml --out out/)
     Real data:    open this page with ?data=real  ->  ../real/out/results.js
     Works offline: three.js is in iot/vendor/. -->
<style>
  :root { color-scheme: dark; --bg:#0b0f17; --panel:#121826; --line:#243049; --ink:#e8ecf5; --mute:#97a3bd;
          --accent:#6f8bff; --ok:#34d27b; --warn:#ffb020; --bad:#ff4d4d; --hit:#ff9f1c; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) 360px; height:100vh; }
  @media (max-width:900px) { .app { grid-template-columns:1fr; height:auto; } #stage { height:58vh; } }
  #stage { position:relative; min-height:320px; background:radial-gradient(ellipse at 50% 40%, #16203a 0%, #0b0f17 70%); }
  #stage canvas { display:block; width:100%; height:100%; outline:none; }
  .hint { position:absolute; left:14px; bottom:12px; color:var(--mute); font-size:12px; pointer-events:none; }
  .banner { position:absolute; left:50%; top:16px; transform:translateX(-50%); padding:8px 18px; border-radius:999px;
            font-weight:800; letter-spacing:.08em; font-size:14px; border:1px solid currentColor; background:rgba(11,15,23,.8);
            opacity:0; transition:opacity .4s; pointer-events:none; }
  .banner.show { opacity:1; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:16px; overflow-y:auto; }
  @media (max-width:900px) { aside { border-left:0; border-top:1px solid var(--line); } }
  h1 { margin:0; font-size:20px; } .sub { margin:2px 0 14px; color:var(--mute); font-size:13px; }
  .tag { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.08em; padding:2px 8px; border-radius:999px;
         border:1px solid currentColor; margin-right:6px; }
  .tag.sim { color:var(--warn); } .tag.real { color:var(--ok); }
  h2 { margin:16px 0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); font-weight:700; }
  .row { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; font-size:13px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#0e1422;
           color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); } button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
  .n { font-size:28px; font-weight:800; line-height:1.1; } .l { font-size:12px; color:var(--mute); }
  .good { color:var(--ok); } .bad { color:var(--bad); }
  ul { margin:4px 0 0; padding-left:18px; } li { margin:3px 0; font-size:13px; }
  .kind { font-family:Consolas,monospace; font-weight:700; color:var(--bad); }
  .legend { display:flex; flex-wrap:wrap; gap:10px 14px; font-size:12px; color:var(--mute); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .note { margin-top:14px; padding:10px 12px; border:1px dashed var(--line); border-radius:10px; color:var(--mute); font-size:13px; }
  a { color:var(--accent); } code { font-family:Consolas,monospace; font-size:12px; }
  .msg { padding:40px 24px; max-width:560px; margin:0 auto; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<div class="app">
  <div id="stage" role="img" aria-label="3D model of the home network. A text summary is in the side panel.">
    <div class="banner" id="banner"></div>
    <div class="hint">Drag to rotate &middot; scroll or pinch to zoom &middot; right-drag to pan</div>
  </div>
  <aside id="panel"><h1>IoT blast radius in 3D</h1><p class="sub">Loading&hellip;</p></aside>
</div>
<div class="sr" id="live" aria-live="polite"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(function () {
  "use strict";
  var useReal = new URLSearchParams(location.search).get("data") === "real";
  var SRC = useReal ? "../real/out/results.js" : "../demo/results.js";
  var REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var HOP = REDUCED ? 0 : 900;           // ms per attacker hop

  var panel = document.getElementById("panel"), stage = document.getElementById("stage");
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text != null) e.textContent = text;
    return e;
  }

  function missing() {
    panel.innerHTML = "";
    var m = el("div", { "class": "msg" });
    m.appendChild(el("h1", {}, "No data yet"));
    m.appendChild(el("p", {}, "This page draws what the engine produced. Generate it first:"));
    m.appendChild(el("p", {}, useReal
      ? "python -m real.main --quick --subnet 192.168.0.0/24 --i-own-this-network"
      : "python -m src.main scenarios/home.yaml --out out/"));
    m.appendChild(el("p", {}, "then reload. Looking for: " + SRC));
    panel.appendChild(m);
  }
  if (!window.THREE || !THREE.OrbitControls) { missing(); return; }

  var s = document.createElement("script");
  s.src = SRC; s.onload = function () { window.RESULTS ? start(window.RESULTS) : missing(); }; s.onerror = missing;
  document.head.appendChild(s);

  function start(R) {
    var C = { dev: 0x7d8aa6, foot: 0xff3b3b, hit: 0xff9f1c, ok: 0x34d27b, warn: 0xffb020,
              host: 0x4da3ff, unk: 0x1b1f2b, flow: 0xff3b3b, blocked: 0x8892a6, hub: 0x19e0d0 };
    var state = { caseId: R.cases[0].id, policy: R.before_policy, hub: false, rotate: false };
    var byId = {};
    R.devices.concat(R.hosts).forEach(function (n) { byId[n.id] = n; });
    function nm(id) { return byId[id] ? byId[id].name : id; }
    function curCase() { return R.cases.filter(function (c) { return c.id === state.caseId; })[0]; }
    function strictness() {                       // 0 = open, 1 = locked, from the policy order in the data
      var n = R.policies.length, i = R.policies.map(function (p) { return p.id; }).indexOf(state.policy);
      return n < 2 ? 0 : i / (n - 1);
    }

    // ---------- scene ----------
    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0b0f17, 38, 80);
    var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x0b0f17, 0);
    stage.insertBefore(renderer.domElement, stage.firstChild);
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 6; controls.maxDistance = 60; controls.autoRotateSpeed = 0.8;

    scene.add(new THREE.AmbientLight(0x8d9bbd, 0.8));
    var sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(8, 18, 10); scene.add(sun);
    var rim = new THREE.PointLight(0x6f8bff, 0.6, 60); rim.position.set(-14, 10, -10); scene.add(rim);

    // world mapping: 2D map coords -> XZ plane, scaled so the home is about 26 units wide
    var xs = [], ys = [];
    R.zones.forEach(function (z) { xs.push(z.x, z.x + z.w); ys.push(z.y, z.y + z.h); });
    R.devices.concat(R.hosts).forEach(function (n) { xs.push(n.x); ys.push(n.y); });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var S = Math.max(maxX - minX, maxY - minY) / 26 || 1, cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    function wx(x) { return (x - cx) / S; } function wz(y) { return (y - cy) / S; }
    var spanZ = (maxY - minY) / S;
    camera.position.set(0, spanZ * 0.7 + 5, spanZ * 0.8 + 9);
    controls.target.set(0, 0, 0);

    var floor = new THREE.Mesh(new THREE.CircleGeometry(40, 64),
      new THREE.MeshStandardMaterial({ color: 0x0f1626, roughness: 1 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -0.02; scene.add(floor);
    var grid = new THREE.GridHelper(80, 80, 0x1c2640, 0x151d31); grid.position.y = 0; scene.add(grid);

    function labelSprite(text, color, h) {
      var c = document.createElement("canvas"), g = c.getContext("2d"), px = 30;
      g.font = "600 " + px + "px system-ui,Segoe UI,Arial,sans-serif";
      var w = Math.ceil(g.measureText(text).width) + 28; c.width = w; c.height = px + 20;
      g = c.getContext("2d"); g.font = "600 " + px + "px system-ui,Segoe UI,Arial,sans-serif";
      g.fillStyle = "rgba(11,15,23,0.72)";
      g.beginPath(); g.roundRect ? g.roundRect(0, 0, c.width, c.height, 14) : g.rect(0, 0, c.width, c.height); g.fill();
      g.fillStyle = color || "#e8ecf5"; g.textBaseline = "middle"; g.fillText(text, 14, c.height / 2 + 1);
      var tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
      var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
      var hh = h || 0.55; sp.scale.set(hh * c.width / c.height, hh, 1); sp.renderOrder = 10; return sp;
    }

    // zones: floor slab + glass walls whose look follows the policy strictness
    var zoneObjs = R.zones.map(function (z, i) {
      var w = z.w / S, d = z.h / S, col = new THREE.Color().setHSL(((i * 67 + 215) % 360) / 360, 0.5, 0.45);
      var slab = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, d),
        new THREE.MeshStandardMaterial({ color: col, roughness: 0.85, transparent: true, opacity: 0.55 }));
      slab.position.set(wx(z.x + z.w / 2), 0.06, wz(z.y + z.h / 2)); scene.add(slab);
      var wallMat = new THREE.MeshBasicMaterial({ color: 0x34d27b, transparent: true, opacity: 0, depthWrite: false,
                                                  side: THREE.DoubleSide });
      var wallGeo = new THREE.BoxGeometry(w, 1.5, d);
      var wall = new THREE.Mesh(wallGeo, wallMat); wall.position.set(slab.position.x, 0.8, slab.position.z); scene.add(wall);
      var edgeMat = new THREE.LineBasicMaterial({ color: 0x394764, transparent: true, opacity: 0.9 });
      var edges = new THREE.LineSegments(new THREE.EdgesGeometry(wallGeo), edgeMat);
      edges.position.copy(wall.position); scene.add(edges);
      var lab = labelSprite(z.name, "#cfd8ee", 0.8); lab.position.set(slab.position.x, 1.9, wz(z.y) + 0.4); scene.add(lab);
      return { wallMat: wallMat, edgeMat: edgeMat, cx: slab.position.x, cz: slab.position.z };
    });

    // devices
    var devObj = {};
    R.devices.forEach(function (d) {
      var g = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: C.dev, roughness: 0.45, metalness: 0.2,
                                                                       emissive: 0x000000 });
      function part(geo, x, y, z, rx) { var m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
        if (rx) m.rotation.x = rx; g.add(m); return m; }
      var BG = THREE.BoxGeometry;
      if (d.type === "laptop") { part(new BG(1.2, 0.08, 0.85), 0, 0.12, 0); part(new BG(1.2, 0.75, 0.06), 0, 0.5, -0.42, -0.22); }
      else if (d.type === "phone") { part(new BG(0.4, 0.8, 0.07), 0, 0.5, 0, -0.15); }
      else if (d.type === "camera") { part(new THREE.CylinderGeometry(0.28, 0.28, 0.7, 20), 0, 0.5, 0);
                                      part(new THREE.ConeGeometry(0.18, 0.35, 16), 0, 0.5, 0.45, Math.PI / 2); }
      else if (d.type === "nvr") { part(new BG(1.1, 0.38, 0.8), 0, 0.3, 0); part(new BG(1.1, 0.38, 0.8), 0, 0.7, 0); }
      else if (d.type === "iot") { part(new BG(0.75, 1.2, 0.65), 0, 0.7, 0); }
      else if (d.type === "guest") { part(new THREE.SphereGeometry(0.45, 20, 16), 0, 0.6, 0); }
      else { part(new THREE.IcosahedronGeometry(0.5, 0), 0, 0.6, 0); }
      if (d.critical) { var ring = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.04, 8, 40),
        new THREE.MeshBasicMaterial({ color: 0xffd24d })); ring.rotation.x = Math.PI / 2; ring.position.y = 0.16; g.add(ring); }
      g.position.set(wx(d.x), 0.12, wz(d.y)); scene.add(g);
      var lab = labelSprite(d.name + (d.critical ? " *" : ""), "#ffffff", 0.8); lab.position.set(g.position.x, 2.0, g.position.z); scene.add(lab);
      devObj[d.id] = { group: g, mat: mat, pos: g.position.clone().add(new THREE.Vector3(0, 0.7, 0)) };
    });

    // outside hosts float beyond the house
    var hostObj = {};
    R.hosts.forEach(function (h, i) {
      var mat = new THREE.MeshStandardMaterial({ color: h.known ? C.host : C.unk, roughness: 0.4,
                                                 emissive: h.known ? 0x0a2a4d : 0x3a0a0a });
      var m = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), mat);
      var g = new THREE.Group(); g.add(m);
      if (!h.known) g.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0xff4d4d })));
      g.position.set(wx(h.x), 2.2, wz(h.y) - 4.5); scene.add(g);
      var lab = labelSprite(h.name, h.known ? "#9cc8ff" : "#ff8a8a", 0.8); lab.position.set(g.position.x, 3.4, g.position.z); scene.add(lab);
      hostObj[h.id] = { group: g, pos: g.position.clone(), phase: i * 1.3 };
    });
    function nodePos(id) { return devObj[id] ? devObj[id].pos : hostObj[id] ? hostObj[id].pos : new THREE.Vector3(); }

    // phase 2 concept: an always-on hub that watches every zone
    var hub = new THREE.Group(), hubMat = new THREE.MeshStandardMaterial({ color: 0x0f3b3a, emissive: C.hub, emissiveIntensity: 0.6 });
    hub.add(new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.7, 1.4), hubMat));
    var hubLab = labelSprite("IoT hub (phase 2 concept)", "#7cf5ea", 0.55); hubLab.position.set(0, 1.5, 0); hub.add(hubLab);
    hub.position.set(0, 0.4, spanZ / 2 + 1.6); hub.visible = false; scene.add(hub);
    var hubLines = new THREE.Group(); hubLines.visible = false; scene.add(hubLines);
    zoneObjs.forEach(function (z) {
      var a = hub.position.clone().add(new THREE.Vector3(0, 0.4, 0)), b = new THREE.Vector3(z.cx, 0.6, z.cz);
      var geo = new THREE.BufferGeometry().setFromPoints([a, b]);
      var ln = new THREE.Line(geo, new THREE.LineDashedMaterial({ color: C.hub, dashSize: 0.4, gapSize: 0.25, transparent: true, opacity: 0.7 }));
      ln.computeLineDistances(); hubLines.add(ln);
    });

    // ---------- dynamic layer (rebuilt on every state change) ----------
    var dyn = new THREE.Group(); scene.add(dyn);
    var pulses = [], timeline = [], runId = 0;
    function clearDyn() {
      for (var i = dyn.children.length - 1; i >= 0; i--) {
        var o = dyn.children[i]; dyn.remove(o);
        o.traverse(function (n) { if (n.geometry) n.geometry.dispose(); if (n.material) { if (n.material.map) n.material.map.dispose(); n.material.dispose(); } });
      }
      pulses.length = 0;
    }
    function later(ms, fn) { if (!ms) fn(); else timeline.push({ at: performance.now() + ms, fn: fn, run: runId }); }
    function arc(a, b, lift) {
      var m = a.clone().add(b).multiplyScalar(0.5); m.y += lift;
      return new THREE.QuadraticBezierCurve3(a, m, b);
    }
    function addLine(curve, color, dashed) {
      var geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(28));
      var ln = new THREE.Line(geo, dashed ? new THREE.LineDashedMaterial({ color: color, dashSize: 0.35, gapSize: 0.3 })
                                           : new THREE.LineBasicMaterial({ color: color }));
      if (dashed) ln.computeLineDistances(); dyn.add(ln); return ln;
    }
    function addPulse(curve, color, dur, loop) {
      var m = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), new THREE.MeshBasicMaterial({ color: color }));
      dyn.add(m); pulses.push({ mesh: m, curve: curve, t0: performance.now(), dur: dur, loop: loop });
    }
    function setNode(id, kind) {
      var o = devObj[id]; if (!o) return;
      var col = kind === "foot" ? C.foot : kind === "hit" ? C.hit : C.dev;
      o.mat.color.setHex(col); o.mat.emissive.setHex(kind === "foot" ? 0x7a0f0f : kind === "hit" ? 0x7a4300 : 0x000000);
      o.mat.emissiveIntensity = kind ? 0.9 : 0;
      if (kind === "hit") { hits++; countEl && (countEl.textContent = hits + " of " + total); }
    }
    function addFlow(f, ok) {
      var a = nodePos(f.src), b = nodePos(f.dst), cv = arc(a, b, 3.2);
      addLine(cv, ok ? C.flow : C.blocked, !ok);
      if (ok) addPulse(cv, C.flow, 1400, true);
      else { var x = labelSprite("✕", "#ff5252", 0.9); x.position.copy(cv.getPoint(0.5)); dyn.add(x); }
    }
    function shieldPulse() {
      var o = devObj[R.foothold]; if (!o) return;
      var ring = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.05, 48), new THREE.MeshBasicMaterial({ color: C.ok, transparent: true, side: THREE.DoubleSide }));
      ring.rotation.x = -Math.PI / 2; ring.position.set(o.group.position.x, 0.25, o.group.position.z); dyn.add(ring);
      pulses.push({ mesh: ring, ring: true, t0: performance.now(), dur: 1500, loop: false });
    }

    var hits = 0, total = R.devices.length - 1, countEl = null;
    function showBanner(text, color) { var b = document.getElementById("banner"); b.textContent = text; b.style.color = color; b.classList.add("show"); }
    function hideBanner() { document.getElementById("banner").classList.remove("show"); }

    function applyWalls() {
      var s = strictness(), col = s >= 0.99 ? C.ok : s > 0 ? C.warn : 0x394764;
      zoneObjs.forEach(function (z) {
        z.wallMat.color.setHex(col); z.wallMat.opacity = s >= 0.99 ? 0.16 : s > 0 ? 0.09 : 0;
        z.edgeMat.color.setHex(col);
      });
    }

    function applyState() {
      runId++; timeline.length = 0; clearDyn(); hideBanner(); hits = 0;
      var c = curCase(), r = c.results[state.policy];
      R.devices.forEach(function (d) { setNode(d.id, null); });
      setNode(R.foothold, "foot");
      applyWalls(); buildPanel();
      var depth = {}; depth[R.foothold] = 0; var maxD = 0;
      r.reach_edges.forEach(function (e) { depth[e[1]] = (depth[e[0]] || 0) + 1; maxD = Math.max(maxD, depth[e[1]]); });
      r.reach_edges.forEach(function (e) {
        later(depth[e[1]] * HOP, function () {
          var cv = arc(nodePos(e[0]), nodePos(e[1]), 1.1); addLine(cv, C.hit, false);
          if (HOP) addPulse(cv, C.hit, HOP * 0.8, false);
          setNode(e[1], "hit");
        });
      });
      var tFlows = (maxD + 1) * HOP;
      c.flows.forEach(function (f, i) { later(tFlows + (HOP ? i * 250 : 0), function () { addFlow(f, r.delivered[i]); }); });
      var tEnd = tFlows + (HOP ? c.flows.length * 250 + 400 : 0);
      later(tEnd, function () {
        if (r.blast_radius === 0 && strictness() >= 0.99) { shieldPulse(); showBanner("CONTAINED", "#34d27b"); }
        else if (strictness() >= 0.99 || r.blast_radius < r.total) showBanner("LIMITED: " + r.blast_radius + " OF " + r.total, "#ffb020");
        else showBanner("SPREAD TO " + r.blast_radius + " OF " + r.total, "#ff4d4d");
        document.getElementById("live").textContent = nm(R.foothold) + " compromised under " + state.policy + ": " + r.blast_radius +
          " of " + r.total + " devices reachable, " + r.alerts.length + " alerts.";
      });
    }

    // ---------- panel ----------
    function chips(label, items, key) {
      var w = el("div"); w.appendChild(el("h2", {}, label)); var row = el("div", { "class": "row" });
      items.forEach(function (it) {
        var b = el("button", { type: "button", "aria-pressed": String(state[key] === it.id), title: it.title || "" }, it.text);
        b.addEventListener("click", function () { state[key] = it.id; applyState(); });
        row.appendChild(b);
      });
      w.appendChild(row); return w;
    }
    function toggle(label, key, onchange) {
      var b = el("button", { type: "button", "aria-pressed": String(!!state[key]) }, label);
      b.addEventListener("click", function () { state[key] = !state[key]; b.setAttribute("aria-pressed", String(state[key])); onchange(); });
      return b;
    }
    function buildPanel() {
      var c = curCase(), r = c.results[state.policy];
      panel.innerHTML = "";
      panel.appendChild(el("h1", {}, "IoT blast radius in 3D"));
      var sub = el("p", { "class": "sub" });
      sub.appendChild(el("span", { "class": "tag " + (useReal ? "real" : "sim") }, useReal ? "YOUR NETWORK" : "SIMULATED"));
      sub.appendChild(document.createTextNode("Compromised: " + nm(R.foothold)));
      panel.appendChild(sub);
      panel.appendChild(chips("Scenario", R.cases.map(function (k) { return { id: k.id, text: k.name }; }), "caseId"));
      panel.appendChild(chips("Policy", R.policies.map(function (p) { return { id: p.id, text: p.id, title: p.description }; }), "policy"));
      var pol = R.policies.filter(function (p) { return p.id === state.policy; })[0];
      panel.appendChild(el("p", { "class": "sub", style: "margin-top:6px" }, pol ? pol.description : ""));

      panel.appendChild(el("h2", {}, "View"));
      var row = el("div", { "class": "row" });
      var replay = el("button", { type: "button" }, "Replay attack"); replay.addEventListener("click", applyState); row.appendChild(replay);
      row.appendChild(toggle("Auto-rotate", "rotate", function () { controls.autoRotate = state.rotate && !REDUCED; }));
      row.appendChild(toggle("Phase 2: IoT hub", "hub", function () { hub.visible = hubLines.visible = state.hub; buildPanel(); }));
      panel.appendChild(row);

      panel.appendChild(el("h2", {}, "Result"));
      var st = el("div", { "class": "stats" });
      var a = el("div"); countEl = el("div", { "class": "n " + (r.blast_radius ? "bad" : "good") }, hits + " of " + r.total);
      a.appendChild(countEl); a.appendChild(el("div", { "class": "l" }, "devices reachable from " + nm(R.foothold))); st.appendChild(a);
      var b = el("div"); b.appendChild(el("div", { "class": "n " + (r.laptop_outbound_mb > R.thresholds.outbound_mb_limit ? "bad" : "good") },
        r.laptop_outbound_mb.toFixed(1) + " MB"));
      b.appendChild(el("div", { "class": "l" }, "left the laptop (limit " + R.thresholds.outbound_mb_limit + " MB)")); st.appendChild(b);
      panel.appendChild(st);
      total = r.total;

      panel.appendChild(el("h2", {}, "Alerts (" + r.alerts.length + ")"));
      var ul = el("ul");
      if (!r.alerts.length) ul.appendChild(el("li", {}, "No alerts"));
      r.alerts.forEach(function (al) { var li = el("li"); li.appendChild(el("span", { "class": "kind" }, al.kind + " "));
        li.appendChild(document.createTextNode(al.message)); ul.appendChild(li); });
      panel.appendChild(ul);

      if (state.hub) panel.appendChild(el("div", { "class": "note" },
        "Concept, not built: a small always-on box on the home network would watch every flow and enforce the default-deny policy " +
        "for routers that cannot (like a consumer Wi-Fi router without VLANs)."));

      panel.appendChild(el("h2", {}, "Legend"));
      var lg = el("div", { "class": "legend" });
      [["#ff3b3b", "Compromised"], ["#ff9f1c", "Reachable"], ["#7d8aa6", "Safe"], ["#4da3ff", "Known host"], ["#1b1f2b;box-shadow:0 0 0 1px #ff4d4d", "Unlisted host"]]
        .forEach(function (l) { var sp = el("span"); var i = el("i"); i.style.cssText = "background:" + l[0]; sp.appendChild(i);
          sp.appendChild(document.createTextNode(l[1])); lg.appendChild(sp); });
      lg.appendChild(el("span", {}, "* critical (gold ring) · red arc = delivered · dashed + ✕ = blocked · glass walls = segmentation"));
      panel.appendChild(lg);
      var nav = el("p", { "class": "sub", style: "margin-top:14px" });
      [["../real/index.html", "Launcher"], ["../demo/index.html", "2D demo"],
       [useReal ? "index.html" : "index.html?data=real", useReal ? "3D simulated" : "3D real network"]].forEach(function (l, i) {
        if (i) nav.appendChild(document.createTextNode(" · ")); var a2 = el("a", { href: l[0] }, l[1]); nav.appendChild(a2); });
      panel.appendChild(nav);
    }

    // ---------- loop ----------
    function resize() {
      var w = stage.clientWidth, h = stage.clientHeight || 400;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
    resize();

    function tick(now) {
      requestAnimationFrame(tick);
      for (var i = timeline.length - 1; i >= 0; i--) {
        var e = timeline[i]; if (e.run !== runId) { timeline.splice(i, 1); continue; }
        if (now >= e.at) { timeline.splice(i, 1); e.fn(); }
      }
      for (var j = pulses.length - 1; j >= 0; j--) {
        var p = pulses[j], u = (now - p.t0) / p.dur;
        if (p.ring) { var k = Math.min(u, 1); p.mesh.scale.setScalar(1 + k * 3); p.mesh.material.opacity = 1 - k;
          if (u >= 1) { dyn.remove(p.mesh); pulses.splice(j, 1); } continue; }
        if (u >= 1 && !p.loop) { dyn.remove(p.mesh); pulses.splice(j, 1); continue; }
        p.mesh.position.copy(p.curve.getPoint(p.loop ? u % 1 : Math.min(u, 1)));
      }
      if (!REDUCED) Object.keys(hostObj).forEach(function (id) { var h = hostObj[id];
        h.group.position.y = h.pos.y + Math.sin(now / 900 + h.phase) * 0.15; h.group.rotation.y = now / 2500 + h.phase; });
      controls.update(); renderer.render(scene, camera);
    }
    applyState();
    requestAnimationFrame(tick);
  }
})();
</script>
