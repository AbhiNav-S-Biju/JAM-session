# The demo home. Everything the code and the demo need lives here.
# expect: blocks are the TEST ORACLE. They were written by hand from the design
# (docs/TEAM_PLAN.md section 11). Never change one to make a test pass.

zones:
  - {name: Trusted,  x: 140, y: 70,  w: 180, h: 180}
  - {name: IoT,      x: 140, y: 300, w: 180, h: 180}
  - {name: Security, x: 380, y: 200, w: 220, h: 180}
  - {name: Guest,    x: 380, y: 430, w: 160, h: 120}

devices:
  - {id: laptop,     name: Laptop,     type: laptop, critical: true,  zone: Trusted,  x: 230, y: 120}
  - {id: phone,      name: Phone,      type: phone,  critical: false, zone: Trusted,  x: 230, y: 200}
  - {id: thermostat, name: Thermostat, type: iot,    critical: false, zone: IoT,      x: 200, y: 350}
  - {id: fridge,     name: Fridge,     type: iot,    critical: false, zone: IoT,      x: 260, y: 430}
  - {id: camera,     name: Camera,     type: camera, critical: false, zone: Security, x: 430, y: 250}
  - {id: doorbell,   name: Doorbell,   type: camera, critical: false, zone: Security, x: 430, y: 330}
  - {id: nvr,        name: NVR,        type: nvr,    critical: true,  zone: Security, x: 550, y: 290}
  - {id: visitor,    name: Visitor,    type: guest,  critical: false, zone: Guest,    x: 470, y: 490}

hosts:
  - {id: weather,    name: Weather service, known: true,  x: 330, y: 30}
  - {id: school,     name: School portal,   known: true,  x: 460, y: 30}
  - {id: thermocloud, name: ThermoCo cloud, known: true,  x: 60,  y: 400}
  - {id: unknown,    name: UNLISTED server, known: false, x: 570, y: 525}

foothold: camera

# The only allow list. vlan_deny uses it; check_baseline uses it to decide what is unusual.
baseline:
  - [laptop, weather]
  - [laptop, school]
  - [phone, weather]
  - [thermostat, thermocloud]
  - [fridge, thermocloud]
  - [camera, nvr]
  - [doorbell, nvr]
  - [visitor, weather]

scenarios:
  - id: camera
    name: Camera is compromised
    flows: []
    expect:
      blast_radius: {flat: 7, vlan_only: 2, vlan_deny: 1}

  - id: vendor
    name: Vendor app takes laptop files
    flows:
      - {src: laptop, dst: unknown, bytes: 48000000, t: 10}
    expect:
      laptop_outbound_mb: {flat: 48.0, vlan_deny: 0.0}
      alerts:
        vlan_deny: [outbound_unlisted, unlisted_flow]

  - id: beacon
    name: Thermostat phones home on a timer
    flows:
      - {src: thermostat, dst: unknown, bytes: 64, t: 0}
      - {src: thermostat, dst: unknown, bytes: 64, t: 60}
      - {src: thermostat, dst: unknown, bytes: 64, t: 120}
      - {src: thermostat, dst: unknown, bytes: 64, t: 180}
      - {src: thermostat, dst: unknown, bytes: 64, t: 240}
    expect:
      alerts:
        flat: [beaconing]
        vlan_only: [beaconing]
        vlan_deny: [beaconing]

  - id: normal_day
    name: Normal day
    flows:
      - {src: laptop,     dst: weather,     bytes: 2000000, t: 100}
      - {src: laptop,     dst: school,      bytes: 1500000, t: 200}
      - {src: phone,      dst: weather,     bytes: 500000,  t: 300}
      - {src: thermostat, dst: thermocloud, bytes: 64,      t: 120}
      - {src: fridge,     dst: thermocloud, bytes: 64,      t: 240}
    expect:
      laptop_outbound_mb: {flat: 3.5, vlan_only: 3.5, vlan_deny: 3.5}

  - id: camera_to_laptop
    name: Compromised camera reaches laptop
    flows:
      - {src: camera, dst: laptop,  bytes: 2000000,  t: 5}
      - {src: laptop, dst: unknown, bytes: 30000000, t: 20}
    expect:
      blast_radius: {flat: 7, vlan_only: 2, vlan_deny: 1}
      laptop_outbound_mb: {flat: 30.0, vlan_only: 0.0, vlan_deny: 0.0}
      alerts:
        flat: [outbound_unlisted, outbound_over_limit, unlisted_flow]
        vlan_only: [outbound_unlisted, unlisted_flow]
        vlan_deny: [outbound_unlisted, unlisted_flow]
